name: Task
description: Tech work, setup, docs, or research
title: "chore: "
labels: ["type: task"]
# projects: ["juanlo7/1"]  # Put the project path here to add issues to the board
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when this task is done?
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      options:
        - "S — up to 2 hours"
        - "M — up to 1 day"
        - "L — up to 3 days"
  - type: textarea
    id: notes
    attributes:
      label: Notes
