name: Feature
description: New user-visible behavior for FireDrift
title: "feat: "
labels: ["type: feature"]
# projects: ["juanlo7/1"]  # Put the project path here to add issues to the board
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who needs this, what do they want, and why?
      placeholder: As a viewer, I want to ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. The issue is done when all are true.
      placeholder: |
        - [ ] The D-pad can reach every new control
        - [ ] Works on the Fire TV device or simulator
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / navigation (D-pad, focus)
        - Media playback
        - AI / AWS backend
        - Voice / multi-modal
        - Build / tooling
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "high — needed for the demo"
        - "medium — makes the demo better"
        - "low — nice to have"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      options:
        - "S — up to 2 hours"
        - "M — up to 1 day"
        - "L — up to 3 days"
        - "XL — split it into smaller issues"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design links, mockups, API docs, open questions.
