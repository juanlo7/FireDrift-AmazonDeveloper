[project]
name = "firedrift-agent"
version = "0.1.0"
description = "FireDrift butler agent: brain, voice and character on Bedrock AgentCore"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
