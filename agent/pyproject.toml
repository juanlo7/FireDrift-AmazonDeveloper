[project]
name = "firedrift-agent"
version = "0.1.0"
description = "FireDrift butler agent: brain, voice and character on Bedrock AgentCore"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.24.0",
    "boto3>=1.43.108",
    "pydantic>=2.11",
    "strands-agents>=1.57.2",
    "websockets>=17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
